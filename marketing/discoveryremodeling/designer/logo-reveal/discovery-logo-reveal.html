<title>Discovery Logo Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&display=swap">
<style>
/* Layout: one stage (Reel 9:16 by default) on white, logo rebuilt as vector so each part animates; controls below */
:root{
  --paper:#ffffff;
  --page:#eef0ec;
  --green:#2f7d1e;
  --green-dark:#24611a;
  --brown:#6e5a52;
  --muted:#6f7a6a;
  --display:"Montserrat", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
html,body{background:var(--page);color:var(--brown)}
body{font-family:var(--display);padding-inline:16px;padding-block:20px;display:flex;flex-direction:column;align-items:center;gap:16px}

.stage{position:relative;width:min(100%, 380px);aspect-ratio:9/16;max-width:100%;background:var(--paper);overflow:hidden;display:grid;place-items:center;box-shadow:0 14px 40px rgba(36,97,26,.18)}
.stage.square{aspect-ratio:1/1;width:min(100%, 440px)}
.stage.wide{aspect-ratio:16/9;width:min(100%, 640px)}

.lockup{display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px}
.logo{width:min(62vw, 230px);height:auto;overflow:visible}
.wide .logo{width:min(24vw, 150px)}
.square .logo{width:min(48vw, 200px)}

.logo .ring{fill:none;stroke:var(--green);stroke-width:3.2;stroke-dasharray:300;stroke-dashoffset:300;transform-origin:50px 50px;transform:rotate(-90deg);animation:draw 1.2s cubic-bezier(.6,0,.2,1) .2s forwards}
.logo .grid path,.logo .grid line,.logo .grid ellipse{fill:none;stroke:var(--green);stroke-width:2.2;stroke-dasharray:101;stroke-dashoffset:101;animation:draw 1s ease-out forwards}
.logo .roof{fill:none;stroke:var(--green);stroke-width:3;stroke-linejoin:miter;stroke-linecap:butt;opacity:0;transform:translateY(-14px);animation:drop .7s cubic-bezier(.3,1.4,.5,1) forwards}
.logo .roof.r1{animation-delay:2.2s}
.logo .roof.r2{animation-delay:2.35s}
.logo .win rect{fill:var(--green);transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .35s cubic-bezier(.3,1.6,.5,1) forwards}

.name{font-weight:800;color:var(--brown);font-size:clamp(30px, 10vw, 44px);letter-spacing:.1em;line-height:1;display:flex;padding-left:.1em;margin-top:6px}
.wide .name{font-size:clamp(22px, 4.6vw, 40px)}
.name span{display:inline-block;opacity:0;transform:translateY(16px);animation:letter .5s cubic-bezier(.2,.7,.2,1) forwards}
.sub{font-weight:500;font-size:13px;letter-spacing:.45em;padding-left:.45em;color:var(--brown);opacity:0;animation:track 1s ease-out 4s forwards}
.wide .sub{font-size:11px}

.handle{position:absolute;bottom:6%;left:0;right:0;text-align:center;font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--green);opacity:0;animation:fadeUp .8s ease-out 4.8s forwards}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes drop{to{opacity:1;transform:none}}
@keyframes pop{to{transform:scale(1)}}
@keyframes letter{to{opacity:1;transform:none}}
@keyframes track{from{opacity:0;letter-spacing:1.1em}to{opacity:1;letter-spacing:.45em}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.controls button{font:500 13px var(--display);color:var(--green-dark);background:var(--paper);border:1px solid rgba(47,125,30,.4);padding:9px 14px;cursor:pointer}
.controls button[aria-pressed="true"]{background:var(--green);color:var(--paper);border-color:var(--green)}
.controls button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.hint{font-size:12px;color:var(--muted);max-width:40ch;text-align:center;line-height:1.5}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important}}
</style>

<div class="stage" id="stage">
  <div class="lockup">
    <svg class="logo" viewBox="0 0 100 100" aria-label="Discovery Remodeling">
      <defs>
        <clipPath id="sky">
          <!-- inside the globe and above the roof -->
          <path d="M0 0 H100 V66.5 L50 43 L0 66.5 Z"></path>
        </clipPath>
        <clipPath id="disc"><circle cx="50" cy="50" r="46.5"></circle></clipPath>
      </defs>

      <g class="grid" clip-path="url(#disc)">
        <g clip-path="url(#sky)">
          <line pathLength="100" x1="50" y1="2" x2="50" y2="60" style="animation-delay:1.1s"></line>
          <ellipse pathLength="100" cx="50" cy="50" rx="13" ry="46" style="animation-delay:1.2s"></ellipse>
          <ellipse pathLength="100" cx="50" cy="50" rx="28" ry="46" style="animation-delay:1.3s"></ellipse>
          <ellipse pathLength="100" cx="50" cy="50" rx="40" ry="46" style="animation-delay:1.4s"></ellipse>
          <path pathLength="100" d="M4 18 Q50 26 96 18" style="animation-delay:1.5s"></path>
          <path pathLength="100" d="M1 32 Q50 42 99 32" style="animation-delay:1.62s"></path>
          <path pathLength="100" d="M0 47 Q50 58 100 47" style="animation-delay:1.74s"></path>
        </g>
        <polyline class="roof r1" points="-2,70 50,45 102,70"></polyline>
        <polyline class="roof r2" points="-2,77 50,52.5 102,77"></polyline>
      </g>

      <circle class="ring" cx="50" cy="50" r="46.5"></circle>

      <g class="win">
        <rect x="44" y="61" width="5" height="5" style="animation-delay:2.75s"></rect>
        <rect x="51" y="61" width="5" height="5" style="animation-delay:2.85s"></rect>
        <rect x="44" y="68" width="5" height="5" style="animation-delay:2.95s"></rect>
        <rect x="51" y="68" width="5" height="5" style="animation-delay:3.05s"></rect>
      </g>
    </svg>
    <div class="name" id="name" aria-label="DISCOVERY">DISCOVERY</div>
    <div class="sub">REMODELING</div>
  </div>
  <div class="handle">@discoveryremodeling</div>
</div>

<div class="controls" role="group" aria-label="Formato">
  <button id="fmt-reel" data-fmt="" aria-pressed="true">Reel 9:16</button>
  <button id="fmt-square" data-fmt="square" aria-pressed="false">Feed 1:1</button>
  <button id="fmt-wide" data-fmt="wide" aria-pressed="false">YouTube 16:9</button>
  <button id="replay">↻ Repetir</button>
</div>
<p class="hint">Grave a tela do celular enquanto a animação toca pra usar como abertura ou fechamento dos vídeos.</p>

<script>
(function(){
  const stage=document.getElementById('stage');
  const name=document.getElementById('name');
  function splitLetters(){
    name.textContent='';
    [...'DISCOVERY'].forEach((ch,i)=>{
      const s=document.createElement('span');
      s.textContent=ch;s.setAttribute('aria-hidden','true');
      s.style.animationDelay=(3.2+i*0.07)+'s';
      name.appendChild(s);
    });
  }
  function restart(){
    const els=stage.querySelectorAll('*');
    const saved=[...els].map(el=>el.style.animationDelay);
    els.forEach(el=>{el.style.animation='none';});
    void stage.offsetWidth;
    els.forEach((el,i)=>{el.style.animation='';el.style.animationDelay=saved[i];});
    splitLetters();
  }
  splitLetters();
  document.getElementById('replay').addEventListener('click',restart);
  document.querySelectorAll('[data-fmt]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      stage.classList.remove('square','wide');
      if(btn.dataset.fmt) stage.classList.add(btn.dataset.fmt);
      document.querySelectorAll('[data-fmt]').forEach(b=>b.setAttribute('aria-pressed', b===btn?'true':'false'));
      restart();
    });
  });
})();
</script>
